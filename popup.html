<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        width: 360px;
        padding: 16px;
        margin: 0;
        background: #f8fafc;
        color: #172033;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.5;
      }
      .item {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .name {
        font-size: 12px;
        color: #475569;
        margin-bottom: 10px;
      }
      .options {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        padding: 9px 10px;
        background: #edf2fa;
        border-radius: 8px;
        font-size: 13px;
      }
      .options input {
        accent-color: #233c81;
      }
      button {
        background: #233c81;
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        margin-right: 6px;
        cursor: pointer;
      }
      .field-label {
        display: block;
        font-size: 12px;
        color: #475569;
        margin-bottom: 10px;
      }
      .filename {
        box-sizing: border-box;
        width: 100%;
        display: block;
        margin-top: 5px;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font:
          13px system-ui,
          sans-serif;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      button.secondary {
        background: #e2e8f0;
        color: #172033;
      }
      #status {
        font-size: 12px;
        color: #475569;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h1>🎓 Uni VTT Downloader</h1>
    <label class="options"
      ><input type="checkbox" id="timestamps" checked /> Includi timestamp nel
      TXT</label
    >
    <div id="items">Cerco trascrizioni…</div>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
